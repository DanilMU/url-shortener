name: url_shortener

services:
    postgres:
        container_name: url_shortener_postgres
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${HOST_POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/src/infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - url_shortener_network

    redis:
        container_name: url_shortener_redis
        image: redis:7-alpine
        restart: always
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
        ports:
            - "${HOST_REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - url_shortener_network

    backend:
        container_name: url_shortener_backend
        build:
            context: ./backend
            dockerfile: Dockerfile
        restart: always
        env_file:
            - .env
        ports:
            - "${HOST_BACKEND_PORT:-4000}:4000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - url_shortener_network

    frontend:
        container_name: url_shortener_frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        restart: always
        ports:
            - "${HOST_FRONTEND_PORT:-3000}:80"
        depends_on:
            - backend
        networks:
            - url_shortener_network

volumes:
    postgres_data:
    redis_data:

networks:
    url_shortener_network:
        driver: bridge
